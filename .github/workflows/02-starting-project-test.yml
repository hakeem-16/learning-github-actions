name: 02 Starting Project - Test
on:
  push:
    paths:
      - '02 Starting Project/**'
      - '.github/workflows/02-starting-project-test.yml'
  workflow_dispatch:
defaults:
  run:
    working-directory: '02 Starting Project'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
